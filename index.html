<!DOCTYPE html>
<html lang="ru">
<head><link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromoFix — Бийск | Работа для промоутеров</title>
    <style>
        /* Главные настройки страницы */
        body { 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #0b0b0c; 
            color: #ffffff; 
            overflow: hidden; /* Запрещаем прокрутку самой страницы сайта */
        }
        
        /* ШАПКА: КОМПАКТНЫЙ ОСТРОВОК С НАЗВАНИЕМ ПО ЦЕНТРУ */
        header {
            position: absolute; 
            top: 15px; 
            left: 10px; 
            right: 10px;
            height: 54px; 
            max-width: 240px; 
            margin: 0 auto; 
            background: rgba(18, 18, 20, 0.85); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex; 
            align-items: center;
            justify-content: center; 
            z-index: 10; 
            border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        
        .logo { 
            font-weight: 700; 
            font-size: 18px; 
            color: #ffffff; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            text-align: center;
        }
        .logo span { 
            color: #8a2be2; 
        }

        /* КОНТЕЙНЕР ДЛЯ БЛОКА УПРАВЛЕНИЯ ПО ЦЕНТРУ */
        .controls-panel {
            position: absolute;
            top: 84px;
            left: 10px;
            right: 10px;
            z-index: 5;
            max-width: 290px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px; /* Отступ между кнопкой ТГ и переключателями карт */
        }

        /* Фиолетовая кнопка Telegram */
        .btn-apply {
            display: block; 
            text-align: center; 
            background-color: #8a2be2; 
            color: #ffffff;
            padding: 12px 24px; 
            border-radius: 14px; 
            text-decoration: none; 
            font-weight: bold;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .btn-apply:hover {
            background-color: #9932cc;
            transform: scale(1.02);
        }

        /* ПАНЕЛЬ ПЕРЕКЛЮЧАТЕЛЕЙ КАРТ */
        .map-switcher {
            display: flex;
            background: rgba(18, 18, 20, 0.9);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .switch-btn {
            flex: 1;
            background: none;
            border: none;
            color: #a1a1aa;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 9px;
            transition: all 0.2s ease;
        }
        /* Стиль активной выбранной кнопки */
        .switch-btn.active {
            background-color: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* КОНТЕЙНЕР ДЛЯ КАРТЫ С СКРЫТИЕМ РЕКЛАМЫ */
        .map-container { 
            position: absolute; 
            top: 0; 
            left: -10px; 
            right: -10px;
            width: calc(100% + 20px); 
            height: calc(100% + 160px); 
            z-index: 1;
        }
        .map-container iframe { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important; 
            height: 100% !important; 
            border: none !important; 
            display: none; /* Изначально прячем обе карты */
        }
        /* Показываем карту, у которой есть класс active */
        .map-container iframe.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Шапка-островок с названием по центру -->
    <header>
        <div class="logo">PROMO<span>FIX</span></div>
    </header>

    <!-- Единый блок управления под шапкой -->
    <div class="controls-panel">
        <!-- Кнопка Телеграм -->
        <a href="https://t.me/PROMOFIX_CHANNELL" target="_blank" class="btn-apply">Telegram-канал</a>
        
        <!-- Переключатель карт -->
        <div class="map-switcher">
            <button id="btn1" class="switch-btn active" onclick="switchMap(1)">Расклейка</button>
            <button id="btn2" class="switch-btn" onclick="switchMap(2)">Листовки</button>
        </div>
    </div>

    <!-- Блок с вашими картами -->
    <div class="map-container">
        <!-- Карта 1: Расклейка -->
        <iframe id="map1" class="active" src="https://yandex.ru/map-widget/v1/?um=constructor%3Ad6e7f9359458fc60318d59e0f2c5e7e4e3df01da34cf8e1c3191aae0cfc99330&amp;source=constructor" frameborder="0"></iframe>
        
        <!-- Карта 2: Листовки -->
        <iframe id="map2" src="https://yandex.ru/map-widget/v1/?um=constructor%3Aa7661f898079f97969a76f41717c905b8cd106e76b31d1e3e574cd628c4cfdc8&amp;source=constructor" frameborder="0"></iframe>
    </div>

    <!-- Исправленная логика переключения -->
    <script>
        function switchMap(mapNumber) {
            // Сбрасываем активность со всех кнопок переключателя
            document.getElementById('btn1').classList.remove('active');
            document.getElementById('btn2').classList.remove('active');
            
            // Скрываем обе карты
            document.getElementById('map1').classList.remove('active');
            document.getElementById('map2').classList.remove('active');
            
            // Включаем нужную карту и подсвечиваем её кнопку
            if (mapNumber === 1) {
                document.getElementById('btn1').classList.add('active');
                document.getElementById('map1').classList.add('active');
            } else {
                document.getElementById('btn2').classList.add('active');
                document.getElementById('map2').classList.add('active');
            }
        }
    </script>

</body>
</html>
