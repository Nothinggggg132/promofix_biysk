<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromoFix — Бийск | Работа для промоутеров</title>
    <style>
        /* Главные настройки страницы */
        body { 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #0b0b0c; 
            color: #ffffff; 
            overflow: hidden; /* Запрещаем прокрутку самой страницы сайта */
        }
        
        /* ШАПКА: КОМПАКТНЫЙ ОСТРОВОК С НАЗВАНИЕМ ПО ЦЕНТРУ */
        header {
            position: absolute; 
            top: 15px; 
            left: 10px; 
            right: 10px;
            height: 54px; 
            
            /* Узкая фиксированная ширина для идеального центрирования */
            max-width: 240px; 
            margin: 0 auto; /* Центрирование всей шапки */
            
            /* Эффект матового стекла */
            background: rgba(18, 18, 20, 0.85); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            
            display: flex; 
            align-items: center;
            justify-content: center; /* Выравнивает логотип строго по центру внутри шапки */
            z-index: 10; 
            
            /* Круглое скругление и тени */
            border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        
        /* Логотип PromoFix */
        .logo { 
            font-weight: 700; 
            font-size: 18px; /* Сделали шрифт чуть крупнее и заметнее */
            color: #ffffff; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            text-align: center;
        }
        .logo span { 
            color: #8a2be2; /* Наш фирменный фиолетовый */
        }

        /* Плашка города Бийск */
        .city { 
            background: rgba(255, 255, 255, 0.05); 
            color: #bcbcc2;
            padding: 5px 12px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* КОНТЕЙНЕР ДЛЯ КАРТЫ С УВЕЛИЧЕННЫМ ОТСТУПОМ ПРОТИВ РЕКЛАМЫ */
        .map-container { 
            position: absolute; 
            top: 0; 
            left: -10px; 
            right: -10px;
            width: calc(100% + 20px); 
            height: calc(100% + 160px); 
            z-index: 1;
        }
        .map-container iframe { 
            width: 100% !important; 
            height: 100% !important; 
            border: none !important; 
        }

        /* ФИОЛЕТОВАЯ КНОПКА: ТЕПЕРЬ СТРОГО ПО ЦЕНТРУ ПОД ШАПКОЙ */
        .btn-apply {
            position: absolute;
            top: 84px; /* Ровно под шапкой (54px высота шапки + 15px отступ + небольшой зазор) */
            left: 10px; 
            right: 10px;
            z-index: 5;
            
            display: block; 
            text-align: center; 
            background-color: #8a2be2; 
            color: #ffffff;
            padding: 12px 24px; 
            border-radius: 14px; 
            text-decoration: none; 
            font-weight: bold;
            font-size: 14px;
            
            /* Делаем её ширину такой же компактной, как у шапки */
            max-width: 290px;
            margin: 0 auto; /* Магия центрирования */
            
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .btn-apply:hover {
            background-color: #9932cc;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <!-- Узкая шапка-островок по центру -->
    <header>
        <div class="logo">PROMO<span>FIX</span></div>
        <div class="city">📍 Бийск</div>
    </header>

    <!-- Компактная кнопка на ваш Telegram-канал -->
    <a href="https://t.me/PROMOFIX_CHANNELL" target="_blank" class="btn-apply">Telegram-канал</a>

    <!-- Блок с вашей картой -->
    <div class="map-container">
       <iframe src="https://yandex.ru/map-widget/v1/?um=constructor%3Ad6e7f9359458fc60318d59e0f2c5e7e4e3df01da34cf8e1c3191aae0cfc99330&amp;source=constructor" width="100%" height="690" frameborder="0"></iframe>
    </div>

</body>
</html>
