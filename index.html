<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromoFix — Бийск | Работа для промоутеров</title>
    <style>
        /* Главные настройки страницы */
        body { 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #0b0b0c; 
            color: #ffffff; 
            overflow: hidden; /* Запрещаем случайную прокрутку страницы */
        }
        
        /* ШАПКА: УЗКИЙ ОСТРОВОК РОВНО ПО ЦЕНТРУ */
        header {
            position: absolute; 
            top: 15px; /* Отступ сверху */
            left: 10px; /* Минимальные отступы по бокам для мобильных */
            right: 10px;
            height: 54px; /* Сделали чуть-чуть поуже по высоте */
            
            /* Жесткая ширина островка — он будет узким и компактным */
            max-width: 340px; 
            margin: 0 auto; /* Магия CSS: выравнивает блок ровно по центру экрана */
            
            /* Эффект матового стекла */
            background: rgba(18, 18, 20, 0.85); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            
            display: flex; 
            align-items: center;
            justify-content: space-between; 
            padding: 0 16px; 
            z-index: 10; 
            
            /* Круглое скругление и тени */
            border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        
        /* Логотип PromoFix */
        .logo { 
            font-weight: 700; 
            font-size: 16px; /* Чуть уменьшили для компактности */
            color: #ffffff; 
            letter-spacing: 1.5px; 
            text-transform: uppercase; 
        }
        .logo span { 
            color: #8a2be2; 
        }

        /* Плашка города Бийск */
        .city { 
            background: rgba(255, 255, 255, 0.05); 
            color: #bcbcc2;
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 13px; 
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Контейнер для Яндекс Карты (теперь она занимает вообще весь экран, с самого верха) */
        .map-container { 
            position: absolute; 
            top: 0; 
            bottom: 0; 
            width: 100%; 
            z-index: 1;
        }
        .map-container iframe { 
            width: 100% !important; 
            height: 100% !important; 
            border: none !important; 
        }

        /* Карточка с информацией слева поверх карты (опустили чуть ниже, чтобы не врезалась в островок) */
        .info-panel {
            position: absolute; 
            top: 95px; 
            left: 20px; 
            width: 280px;
            background: rgba(18, 18, 20, 0.9); 
            padding: 24px; 
            border-radius: 16px;
            z-index: 5; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
        }
        
        /* Стильная фиолетовая кнопка */
        .btn-apply {
            display: block; 
            text-align: center; 
            background-color: #8a2be2; 
            color: #ffffff;
            padding: 14px; 
            border-radius: 10px; 
            text-decoration: none; 
            font-weight: bold;
            margin-top: 20px; 
            transition: background 0.2s ease;
        }
        .btn-apply:hover {
            background-color: #9932cc;
        }
    </style>
</head>
<body>

    <!-- Верхняя панель в виде островка -->
    <header>
        <div class="logo">PROMO<span>FIX</span></div>
        <div class="city">📍 Бийск</div>
    </header>

    <!-- Информационное окно -->
    <div class="info-panel">
        <a href="https://t.me/PROMOFIX_CHANNELL" target="_blank" class="btn-apply">Telegram-канал</a>
    </div>

    <!-- Блок с вашей картой -->
    <div class="map-container">
       <iframe src="https://yandex.ru/map-widget/v1/?um=constructor%3Ad6e7f9359458fc60318d59e0f2c5e7e4e3df01da34cf8e1c3191aae0cfc99330&amp;source=constructor" width="100%" height="690" frameborder="0"></iframe>
    </div>

</body>
</html>
